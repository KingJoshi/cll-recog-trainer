<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Practice 2x2 CLL recognition offline. Installable PWA for phones and tablets.">
    <meta name="theme-color" content="#007bff">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <title>2x2 CLL Recog Trainer</title>
    <link rel="stylesheet" href="/src/style.css">
</head>
<body>

<div class="main-container">
  <div class="controls-container">
    <div class="add-clear-row">
      <button id="addAllBtn" class="add-clear-btn">Add all</button>
      <button id="clearAllBtn" class="add-clear-btn wider">Clear all</button>
    </div>
    <div class="collapsible collapsed" id="groupHeader">Groups</div>
    <div class="collapsible-content">
      <select id="groupSelect" multiple>
        <option value="A" selected>A</option>
        <option value="H" selected>H</option>
        <option value="L" selected>L</option>
        <option value="P" selected>P</option>
        <option value="S" selected>S</option>
        <option value="T" selected>T</option>
        <option value="U" selected>U</option>
      </select>
    </div>
    <div class="collapsible collapsed" id="caseHeader">Cases</div>
    <div class="collapsible-content">
      <select id="caseSelect" multiple>
        <!-- Cases will be populated by JavaScript -->
      </select>
    </div>
    <div class="toggle-group">
      <button class="toggle-btn" data-toggle="alwaysWhiteBottom" id="toggleAlwaysWhiteBottom">Always White Bottom</button>
      <button class="toggle-btn" data-toggle="allowAUF" id="toggleAllowAUF">Allow AUF</button>
      <button class="toggle-btn" data-toggle="showCaseInfo" id="toggleShowCaseInfo">Show Case Info</button>
    </div>
    <button id="regenerateBtn">Regenerate Scramble</button>

    <!-- Guessing UI (hidden when Show Case Info is checked) -->
    <div id="guessing-container" style="display: none; margin-top: 20px;">
      <div class="guess-section">
        <label style="display: block; margin-bottom: 10px; font-weight: bold;">Guess the Group & Case:</label>
        <div class="button-group">
          <button class="group-btn" data-group="A">A</button>
          <button class="group-btn" data-group="H">H</button>
          <button class="group-btn" data-group="L">L</button>
          <button class="group-btn" data-group="P">P</button>
          <button class="group-btn" data-group="S">S</button>
          <button class="group-btn" data-group="T">T</button>
          <button class="group-btn" data-group="U">U</button>
        </div>
      </div>

      <div class="guess-section">
        <div class="button-group">
          <button class="case-btn" data-case="1">1</button>
          <button class="case-btn" data-case="2">2</button>
          <button class="case-btn" data-case="3">3</button>
          <button class="case-btn" data-case="4">4</button>
          <button class="case-btn" data-case="5">5</button>
          <button class="case-btn" data-case="6">6</button>
        </div>
      </div>

      <button id="verifyBtn">Verify</button>

      <div id="verify-message" style="display: none; margin-top: 15px; padding: 15px; border-radius: 4px; font-weight: bold; text-align: center;">
      </div>
    </div>
  </div>

  <div id="display-container"></div>
  <div id="case-info-container"></div>

  <!-- Stats Table -->
  <div id="stats-table-container" style="margin-top: 20px; margin-bottom: 20px;"></div>

  <!-- Reset Stats Button -->
  <button id="resetStatsBtn" style="margin-top: 20px; margin-bottom: 20px; padding: 8px 15px; background-color: #dc3545; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 0.9rem; max-width: 300px;">Reset Stats</button>
</div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
