<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Microsoft Sign-In — Cubing.cc</title>
  <style>
    body {
      margin: 0;
      padding: 32px 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif;
      background: #eef1f5;
      color: #1f2933;
      text-align: center;
    }
    @media (prefers-color-scheme: dark) {
      body {
        background: #0f172a;
        color: #f1f5f9;
      }
      .card {
        background: #1e293b;
        border-color: #334155;
      }
    }
    .card {
      max-width: 420px;
      margin: 40px auto 0;
      padding: 24px;
      background: #ffffff;
      border: 1px solid #d5dbe3;
      border-radius: 12px;
    }
    a {
      color: #007bff;
    }
  </style>
</head>
<body>
  <div class="card">
    <p id="statusMsg">Completing Microsoft sign-in…</p>
    <p id="fallbackLink" hidden><a href="/">Return to Cubing.cc</a></p>
  </div>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var payload = {
        type: "cubing-ms-oauth-callback",
        code: params.get("code") || "",
        state: params.get("state") || "",
        error: params.get("error") || "",
        errorDescription: params.get("error_description") || ""
      };
      var statusEl = document.getElementById("statusMsg");
      var linkEl = document.getElementById("fallbackLink");

      if (window.opener && !window.opener.closed) {
        try {
          window.opener.postMessage(payload, window.location.origin);
          if (statusEl) {
            statusEl.textContent = payload.error
              ? "Sign-in cancelled or returned an error. You can close this window."
              : "Sign-in complete! Returning to Cubing.cc…";
          }
          window.close();
          return;
        } catch (err) {}
      }

      if (statusEl) {
        statusEl.textContent = payload.error
          ? ("Microsoft sign-in failed: " + (payload.errorDescription || payload.error))
          : "This window was opened outside the Cubing.cc popup flow.";
      }
      if (linkEl) linkEl.hidden = false;
    })();
  </script>
</body>
</html>
